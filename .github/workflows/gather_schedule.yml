name: Zenifix Gather Robot

on:
  # [1번 기능] 수동으로 버튼을 눌러서 원할 때 즉시 실행할 수 있는 스위치
  workflow_dispatch:
  
  # [2번 기능] 15분 간격으로 로봇이 자동으로 깨어나서 실행되도록 하는 알람
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run-gatherer:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 필요 라이브러리 설치
        run: pip install gspread google-auth pandas requests beautifulsoup4 deep-translator openpyxl

      - name: 4. 수집 스크립트 실행!
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python gatherer.py
